name: 'Build Ubuntu Package'
description: 'Build the package for a given distribution and test it.'

inputs:
  os:
    description: 'Release OS to build and test package for.'
    required: true
  distro:
    description: 'Distribution to build and test package for.'
    required: true
  llvm:
    description: 'LLVM version to use.'
    required: true
  dockerfile:
    description: 'Hardcode the path of the dockerfile to use.'
    required: false
    default: .github/workflows/Dockerfile
  build-package:
    description: 'Script which builds the given package.'
    required: true
  test-package:
    description: 'Script which tests the given package.'
    required: true
  pkg-name:
    description: 'Where to move the package.'
    required: false
    default: package.pkg

runs:
  using: 'composite'

  steps:

  - name: 'Check out code'
    uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    with:
      path: k-${{ inputs.distro }}
      submodules: recursive
      persist-credentials: false

  - name: 'Set up Docker'
    uses: ./.github/actions/with-docker
    with:
      tag: kllvm-package-build-${{ inputs.os }}-${{ inputs.distro }}-${{ github.sha }}
      subdir: k-${{ inputs.distro }}/
      os: ${{ inputs.os }}
      distro: ${{ inputs.distro }}
      llvm: ${{ inputs.llvm }}
      dockerfile: ${{ inputs.dockerfile }}

  - name: 'Build Package: ${{ inputs.distro }}'
    shell: bash {0}
    env:
      BASE_DISTRO: ${{ inputs.distro }}
      BASE_OS: ${{ inputs.os }}
      BUILD_PACKAGE: ${{ inputs.build-package }}
      PKG_NAME: ${{ inputs.pkg-name }}
    run: |
      set -euxo pipefail
      docker exec -t "kllvm-package-build-${BASE_OS}-${BASE_DISTRO}-${GITHUB_SHA}" /bin/bash -c "${BUILD_PACKAGE} ${PKG_NAME}"
      # The sources are copied into the container, so copy the package back out.
      docker cp "kllvm-package-build-${BASE_OS}-${BASE_DISTRO}-${GITHUB_SHA}:/home/github-user/workspace/${PKG_NAME}" "${PKG_NAME}"

  - name: 'Tear down Docker'
    shell: bash {0}
    env:
      BASE_DISTRO: ${{ inputs.distro }}
      BASE_OS: ${{ inputs.os }}
    if: always()
    run: |
      # Best effort: the container does not exist if 'Set up Docker' failed, and a
      # non-zero exit here would mask the step that actually failed.
      docker rm -f "kllvm-package-build-${BASE_OS}-${BASE_DISTRO}-${GITHUB_SHA}" || true

  - name: 'Set up Docker Test Image: ${{ inputs.os }}:${{ inputs.distro }}'
    shell: bash {0}
    env:
      BASE_OS: ${{ inputs.os }}
      BASE_DISTRO: ${{ inputs.distro }}
    run: |
      set -euxo pipefail
      docker rm -f "kllvm-package-test-${BASE_OS}-${BASE_DISTRO}-${GITHUB_SHA}" || true
      # ECR Public mirror of the Docker official images, without Docker Hub's pull rate limit.
      docker run                                                          \
        --name "kllvm-package-test-${BASE_OS}-${BASE_DISTRO}-${GITHUB_SHA}" \
        --rm -it                                                          \
        --detach                                                          \
        --workdir /opt/workspace                                          \
        -v "$(pwd):/opt/workspace"                                        \
        "public.ecr.aws/docker/library/${BASE_OS}:${BASE_DISTRO}"

  - name: 'Test Package: ${{ inputs.os }}:${{ inputs.distro }}'
    shell: bash {0}
    env:
      BASE_OS: ${{ inputs.os }}
      BASE_DISTRO: ${{ inputs.distro }}
      TEST_PACKAGE: ${{ inputs.test-package }}
      PKG_NAME: ${{ inputs.pkg-name }}
    run: |
      set -euxo pipefail
      docker exec -t "kllvm-package-test-${BASE_OS}-${BASE_DISTRO}-${GITHUB_SHA}" /bin/bash -c "${TEST_PACKAGE} ${PKG_NAME}"

  - name: 'Tear down Docker Test'
    shell: bash {0}
    env:
      BASE_OS: ${{ inputs.os }}
      BASE_DISTRO: ${{ inputs.distro }}
    if: always()
    run: |
      docker rm -f "kllvm-package-test-${BASE_OS}-${BASE_DISTRO}-${GITHUB_SHA}" || true
