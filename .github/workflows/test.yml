name: "Run LLVM backend tests"
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - 'develop'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# No job here writes to the repository, so the token stays read-only regardless of
# the repository default.
permissions:
  contents: read

jobs:
  compile-nix-flake:
    name: 'Nix flake'
    strategy:
      fail-fast: false
      matrix:
        # `os` is unused, but it is part of the job names that branch protection requires.
        include:
          - runner: [self-hosted, linux, normal]
            os: ubuntu-24.04
          - runner: [self-hosted, self-macos-latest]
            os: self-macos-latest
    # Both runners have Nix installed. Neither Nix nor cachix-action is installed here:
    # cachix-action would pick up a revoked token stored on the runners.
    runs-on: ${{ matrix.runner }}
    steps:
      - name: 'Check out code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Check out pull request HEAD instead of merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: 'Build LLVM backend'
        run: GC_DONT_GC=1 nix build --print-build-logs .

      - name: 'Build pattern matching compiler'
        run: GC_DONT_GC=1 nix build --print-build-logs .#llvm-backend-matching

      - name: 'Smoke test integration test shell'
        run: GC_DONT_GC=1 nix develop --print-build-logs .#integration-test-shell-18 --command lit -v test/defn/imp.kore

      - name: 'Test LLVM backend'
        run: GC_DONT_GC=1 nix flake check --print-build-logs

  build-from-source:
    name: 'Build LLVM backend from source'
    runs-on: [self-hosted, linux, normal]
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: jammy
            llvm: 15
          - distro: noble
            llvm: 17
    env:
      CONTAINER: llvm-backend-${{ github.job }}-${{ matrix.distro }}-${{ github.sha }}
    steps:
      - name: 'Check out code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: 'Set up Docker'
        uses: ./.github/actions/with-docker
        with:
          tag: ${{ env.CONTAINER }}
          os: ubuntu
          distro: ${{ matrix.distro }}
          llvm: ${{ matrix.llvm }}

      - name: 'Run backend tests'
        env:
          LLVM_VERSION: ${{ matrix.llvm }}
        run: docker exec -t "${CONTAINER}" .github/workflows/ci-tests.sh "${LLVM_VERSION}"

      - name: 'Tear down Docker'
        if: always()
        run: |
          # Best effort: the container does not exist if 'Set up Docker' failed, and a
          # non-zero exit here would mask the step that actually failed.
          docker rm -f "${CONTAINER}" || true

  build-ubuntu-package:
    name: 'Build Ubuntu package'
    runs-on: [self-hosted, linux, normal]
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: jammy
            llvm: 15
          - distro: noble
            llvm: 17

    steps:
      - name: 'Check out code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Build package in Docker'
        uses: ./.github/actions/test-package
        with:
          os: ubuntu
          distro: ${{ matrix.distro }}
          llvm: ${{ matrix.llvm }}
          build-package: package/debian/build-package ${{ matrix.distro }}
          test-package: package/debian/test-package
